<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14060a">
  <title>Kino Rodzinne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="curtain curtain-left" aria-hidden="true"></div>
  <div class="curtain curtain-right" aria-hidden="true"></div>

  <header class="marquee">
    <div class="bulbs" aria-hidden="true"></div>
    <h1>Kino <span>Rodzinne</span></h1>
    <p class="tagline">Wielkie głosowanie na film wieczoru</p>

  <main id="app" aria-live="polite"></main>

  <footer class="credits">🎬 Tata · Mama · Ula · Antek przedstawiają 🍿</footer>

  <template id="confirm-dialog">
    <dialog class="dialog">
      <form method="dialog">
        <p class="dialog-text"></p>
        <div class="row"></div>
      </form>
    </dialog>
  </template>

  <script src="movies.js"></script>
  <script src="app.js"></script>

</html>
