html/head_include="<style>body{background:#000;}</style>
<script>
/* Sound on phones (remake/README.md, Running). Godot resumes Web Audio on input; this also resumes it on
   every tap, click or key (browsers suspend it after calls or app switches) and lets it play while an
   iPhone is in silent mode: the Audio Session API, or on older iOS a looping silent audio element. */
(function () {
  var A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  var ctxs = [];
  var P = class extends A { constructor(o) { super(o); ctxs.push(this); } };
  window.AudioContext = P;
  if (window.webkitAudioContext) window.webkitAudioContext = P;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var ios = navigator.maxTouchPoints > 0 && /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  var silent = null;
  function unlock() {
    ctxs.forEach(function (c) { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(function () {}); });
    if (ios && !navigator.audioSession && !silent) {
      silent = document.createElement('audio');
      silent.setAttribute('x-webkit-airplay', 'deny');
      silent.loop = true;
      silent.src = 'data:audio/wav;base64,UklGRogAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWQAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
      silent.play().catch(function () { silent = null; });
    }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, unlock, true); });
})();
</script>"
