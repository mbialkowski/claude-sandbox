# DOSBox 0.74 / DOSBox-X / DOSBox Staging configuration for the original Lazarus.
# Run from this directory:   dosbox -conf dosbox.conf
[sdl]
fullscreen=false
output=opengl

[dosbox]
machine=svga_s3
memsize=16

[cpu]
core=dynamic
cycles=max

[mixer]
rate=44100

[sblaster]
# The game supports Sound Blaster 1/2/Pro/16 (IRQ must be <= 7) and Gravis UltraSound.
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[gus]
gus=false

[autoexec]
mount c .
c:
LAZARUS.EXE
